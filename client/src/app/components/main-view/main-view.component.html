<div class="min-h-screen bg-nhl-white text-nhl-black font-sans flex flex-col">
  
  <!-- Top Navigation Bar -->
  <div class="w-full bg-nhl-black border-b border-white/10 shadow-md relative z-50">
    <div class="px-4 md:px-8 max-w-7xl mx-auto">
      <header class="flex items-center justify-between h-14">
        
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-nhl-blue rounded flex items-center justify-center shadow-lg shadow-nhl-blue/20">
            <span class="text-white font-black text-lg italic">S</span>
          </div>
          <h1 class="text-xl font-black uppercase tracking-tight flex items-center text-white">
            <span>NHL</span>
            <span class="text-nhl-blue ml-px">STATS</span>
          </h1>
        </div>
        
        <!-- Navigation -->
        <nav class="hidden sm:flex h-full">
          <ul class="flex items-center h-full text-xs font-bold text-gray-300 tracking-wider">
            <li class="h-full border-b-2 border-transparent hover:border-white transition-colors">
              <a href="#" class="px-5 h-full flex items-center hover:text-white transition-colors">HOME</a>
            </li>
            
            <!-- Games Dropdown -->
            <li class="h-full group">
              <button class="px-5 h-full flex items-center hover:text-white transition-colors group-hover:text-white border-b-2 border-transparent group-hover:border-nhl-blue cursor-pointer gap-1 focus:outline-none">
                GAMES
                <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </button>

              <div class="absolute left-0 top-14 w-full bg-nhl-black shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 border-b border-white/10 origin-top">
                <div class="max-w-[1600px] w-full mx-auto py-4 px-4 md:px-12">
                  <app-games></app-games>
                </div>
              </div>
            </li>
            
            <li class="h-full border-b-2 border-transparent hover:border-white transition-colors">
              <a href="#" class="px-5 h-full flex items-center hover:text-white transition-colors">STANDINGS</a>
            </li>
          </ul>
        </nav>
      </header>
    </div>
  </div>

  <!-- Main Content -->
  <div class="relative flex-1 w-full bg-cover bg-center bg-fixed bg-no-repeat overflow-hidden shadow-inner" style="background-image: url('/assets/leafs-senators.jpg'); min-height: calc(100vh - 3.5rem);">
    <div class="absolute inset-0 bg-linear-to-b from-black/60 via-black/40 to-black/80"></div>

    <div class="relative z-10 w-full px-4 md:px-8 max-w-[1400px] mx-auto py-10 pb-20 flex flex-col lg:flex-row gap-10">
      
      <!-- Left Column: Standings -->
      <div class="flex-1 flex flex-col gap-6">
        <div class="mb-2">
          <h2 class="text-xl font-black text-white tracking-widest uppercase">Standings</h2>
          <hr class="mt-2 border-white/20">
        </div>
        <app-standings-full></app-standings-full>
      </div>

      <!-- Right Column: Statistics -->
      <aside class="w-full lg:w-80 flex flex-col gap-6">
        <div class="mb-2">
          <h2 class="text-xl font-black text-white tracking-widest uppercase">Statistics</h2>
          <hr class="mt-2 border-white/20">
        </div>
        <app-stats-preview></app-stats-preview>
      </aside>

    </div>
  </div>
</div>
